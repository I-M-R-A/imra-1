name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install project first so pyproject constraints are applied early
          pip install -e .
          # Ensure a Click version compatible with Typer/Rich used here
          pip install 'click==8.0.4'
          # Install test/runtime deps (do not force upgrades of already-satisfied deps)
          pip install pytest numpy pydantic rich typer pyyaml networkx sympy
      - name: Import test
        run: python -c "import imra; print('imra import ok')"
      - name: Run unit tests
        run: PYTHONPATH=src pytest tests/unit -v
      - name: Run stress tests
        run: PYTHONPATH=src pytest tests/stress -v
