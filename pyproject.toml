[tool.poetry]
name = "imra"
version = "0.1.0"
description = "Intuition-Machinery Reasoning Architecture (IMRA-1) research framework"
authors = ["IMRA Research Lab <ntokozo.dlamini.xyz@gmail.com>"]
license = "GNU GPL v3"
readme = "README.md"
packages = [{ include = "imra", from = "src" }]

[tool.poetry.dependencies]
python = "^3.10"
numpy = "^1.26"
pydantic = "^2.6"
rich = "^13.7"
typer = { version = "^0.9", extras = ["all"] }
pyyaml = "^6.0"
networkx = "^3.2"
sympy = "^1.12"
fastapi = "^0.110.0"
uvicorn = { version = "^0.24.0", extras = ["standard"] }
torch = { version = "^2.3.0", optional = true }
click = ">=8.0,<8.2"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
pytest-cov = "^4.1"
ruff = "^0.3.0"
mypy = "^1.8"
types-pyyaml = "^6.0"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN"]
ignore = ["ANN401", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "E402"]
"examples/**" = ["ANN", "E402"]
"experiments/**" = ["ANN", "E402"]
"run_validation_suite.py" = ["ANN"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --maxfail=1"
pythonpath = ["src"]

[tool.poetry.extras]
reasoning = ["torch"]

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
